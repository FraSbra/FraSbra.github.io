<!-- Site header.
     Edit _data/navigation.yml to change menu items. -->
<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__identity">
      <a class="site-brand" href="{{ '/' | relative_url }}">
        <span class="site-brand__name">{{ site.title }}</span>
        <span class="site-brand__meta">{{ site.data.profile.role }}</span>
      </a>

      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
        <span class="visually-hidden">Toggle light and dark theme</span>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.25"></circle>
          <path d="M12 1.75v3"></path>
          <path d="M12 19.25v3"></path>
          <path d="M4.75 4.75l2.1 2.1"></path>
          <path d="M17.15 17.15l2.1 2.1"></path>
          <path d="M1.75 12h3"></path>
          <path d="M19.25 12h3"></path>
          <path d="M4.75 19.25l2.1-2.1"></path>
          <path d="M17.15 6.85l2.1-2.1"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M17.5 14.5c-1.25.7-2.65 1.05-4.2 1.05-4.8 0-8.7-3.9-8.7-8.7 0-1.55.35-2.95 1.05-4.2-2.55 1.45-4.15 4.15-4.15 7.15 0 4.55 3.7 8.25 8.25 8.25 3 0 5.7-1.6 7.15-4.15z"></path>
          <path d="M14.7 3.3l.45 1.4a2.9 2.9 0 0 0 1.85 1.85l1.4.45-1.4.45a2.9 2.9 0 0 0-1.85 1.85l-.45 1.4-.45-1.4a2.9 2.9 0 0 0-1.85-1.85l-1.4-.45 1.4-.45a2.9 2.9 0 0 0 1.85-1.85z"></path>
        </svg>
      </button>
    </div>

    <div class="site-header__utilities">
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <ul class="site-nav__list">
          {% for link in site.data.navigation.main %}
            <li class="site-nav__item">
              <a href="{{ link.url | relative_url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
      </nav>

      <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="site-nav-toggle__label">Menu</span>
      </button>
    </div>
  </div>
</header>
