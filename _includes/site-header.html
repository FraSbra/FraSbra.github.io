<!-- Site header.
     Edit _data/navigation.yml to change menu items. -->
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="site-brand__name">{{ site.title }}</span>
      <span class="site-brand__meta">{{ site.data.profile.role }}</span>
    </a>

    <div class="site-header__utilities">
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <ul class="site-nav__list">
          {% for link in site.data.navigation.main %}
            <li class="site-nav__item">
              <a href="{{ link.url | relative_url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
      </nav>

      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch theme">
        <span class="theme-toggle__label">Dark theme</span>
      </button>

      <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="site-nav-toggle__label">Menu</span>
      </button>
    </div>
  </div>
</header>
