# Academic website configuration.
# Keep this file focused on site-wide behavior and metadata.

title: "Francesco Sbrana"
description: "Academic website of Francesco Sbrana, PhD student in economics working on applied microeconomics, crime, and conflict."
email: "francesco.sbrana@carloalberto.org"
locale: "en"
timezone: "Europe/Rome"
url: "https://frasbra.github.io"
baseurl: ""
repository: "FraSbra/FraSbra.github.io"
site_image: "/images/profile.png"
site_logo: "/images/favicon-512x512.png"
title_separator: "|"

collections:
  publications:
    output: true
    permalink: /publications/:name/
  talks:
    output: true
    permalink: /talks/:name/
  teaching:
    output: true
    permalink: /teaching/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: false

include:
  - .htaccess
  - _pages
  - files

exclude:
  - .bundle
  - .devcontainer
  - .github
  - .sass-cache
  - .codex
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - README.md
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/css/collapse.css
  - assets/webfonts
  - "*.sublime-project"
  - "*.sublime-workspace"

markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..3

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
